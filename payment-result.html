<!doctype html><html lang="en"><head><meta charset="utf-8"><meta name="viewport" content="width=device-width,initial-scale=1"><meta name="robots" content="noindex,nofollow"><title>Confirming payment | USA Vendor</title><style>body{font:16px system-ui;margin:0;background:#f6f4ef;color:#191919;display:grid;min-height:100vh;place-items:center}.box{background:white;padding:32px;border-radius:18px;max-width:520px;margin:20px;box-shadow:0 10px 40px #0001}a{color:#8a641b}</style></head><body><main class="box"><h1>Checking your payment…</h1><p id="message">Please wait while we confirm your transaction securely with Flutterwave. Do not close this page.</p><p><a href="/">Return to USA Vendor</a></p></main><script>
(async()=>{const p=new URLSearchParams(location.search);if(p.get('status')!=='successful'||!p.get('transaction_id')){document.querySelector('h1').textContent='Payment not completed';document.querySelector('#message').textContent='Flutterwave did not return a successful payment status. If you believe you were charged, contact USA Vendor before trying again.';return;}const verify=new URL('/.netlify/functions/verify-payment',location.origin);for(const k of ['tx_ref','amount','currency','sig','transaction_id'])if(p.has(k))verify.searchParams.set(k,p.get(k));location.replace(verify.toString());})();
</script></body></html>
